<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单词大师 | Word & Sentence Master</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #3b82f6 100%);
            --primary-color: #4f46e5;
            --bg-body: #f1f5f9;
            --soft-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
            --active-tab-bg: #0ea5e9;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: #1e293b;
            padding-bottom: 50px;
        }

        /* 顶部背景图 */
        .header-bg {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.85) 0%, rgba(59, 130, 246, 0.75) 100%),
                url('./image/background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 360px;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 0;
            border-bottom-right-radius: 50px;
            border-bottom-left-radius: 50px;
        }

        /* 导航栏样式 */
        .navbar-custom {
            /* background: var(--primary-gradient); REMOVE THIS */
            background: white;
            position: sticky;
            top: 0;
            z-index: 1000;
            padding-top: 20px;
            padding-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border-bottom: 1px solid #e2e8f0;
        }

        .nav-link-custom {
            color: #64748b !important;
            font-weight: 500;
            font-size: 1.15rem;
            margin: 0 15px;
            position: relative;
            transition: all 0.3s;
        }

        .nav-link-custom:hover,
        .nav-link-custom.active {
            color: var(--primary-color) !important;
            font-weight: 600;
        }

        .nav-link-custom::after {
            content: '';
            position: absolute;
            width: 0;
            height: 3px;
            bottom: -5px;
            left: 50%;
            background-color: var(--primary-color);
            transition: all 0.3s ease;
            transform: translateX(-50%);
            border-radius: 2px;
        }

        .nav-link-custom.active::after {
            width: 20px;
        }

        .nav-link-custom:hover::after {
            width: 100%;
        }

        .navbar-brand-custom {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--primary-color) !important;
        }

        /* 主容器 */
        .main-container {
            position: relative;
            z-index: 10;
            max-width: 900px;
            margin: 20px auto 40px;
            padding: 0 20px;
        }

        .page-title {
            color: white;
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            text-align: center;
            margin-bottom: 10px;
            margin-top: 20px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        /* 副标题样式 */
        .page-subtitle {
            color: rgba(255, 255, 255, 0.9);
            text-align: center;
            font-size: 1.05rem;
            margin-bottom: 40px;
            font-weight: 400;
            letter-spacing: 1px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }



        /* 搜索框样式 */
        .search-container {
            background: white;
            padding: 8px 10px 8px 25px;
            border-radius: 50px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            margin-bottom: 40px;
            border: 2px solid transparent;
            transition: border-color 0.2s;
        }

        .search-container:focus-within {
            border-color: #bae6fd;
        }

        .search-input {
            flex-grow: 1;
            border: none;
            padding: 12px 0;
            font-size: 1.1rem;
            outline: none;
            color: #334155;
            background: transparent;
        }

        .search-input::placeholder {
            color: #94a3b8;
            font-weight: 400;
        }

        .btn-search-icon {
            background: transparent;
            color: #64748b;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.3rem;
            cursor: pointer;
            transition: color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-search-icon:hover {
            color: var(--primary-color);
        }

        /* 表格样式 */
        .card-table {
            background: white;
            border-radius: 20px;
            border: none;
            box-shadow: var(--soft-shadow);
            overflow: hidden;
        }

        .table thead th {
            background: #f8fafc;
            color: #64748b;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 18px 24px;
            border: none;
        }

        .table tbody td {
            padding: 20px 24px;
            vertical-align: middle;
            border-bottom: 1px solid #f1f5f9;
        }

        .word-text {
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 1.1rem;
            color: #1e293b;
        }

        .translation-text {
            display: block;
            font-size: 0.85rem;
            color: #64748b;
            font-weight: 400;
            margin-top: 2px;
        }

        .btn-sentence {
            background-color: #ecfdf5;
            color: #059669;
            border: none;
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-sentence:hover {
            background-color: #d1fae5;
            color: #047857;
            transform: translateY(-1px);
        }

        /* --- 修改点：新增文本排名样式 --- */
        .rank-text-movie {
            color: #4338ca;
            font-weight: 700;
        }

        .rank-text-coca {
            color: #c2410c;
            font-weight: 700;
        }

        .rank-divider {
            color: #cbd5e1;
            margin: 0 6px;
            font-weight: 300;
        }

        /* 弹窗样式 */
        .modal-content {
            border-radius: 20px;
            border: none;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .modal-header {
            border-bottom: 1px solid #f1f5f9;
            padding: 20px 30px;
        }

        .modal-body {
            padding: 0;
        }

        .sentence-item {
            padding: 20px 30px;
            border-bottom: 1px solid #f1f5f9;
        }

        .sentence-item:last-child {
            border-bottom: none;
        }

        .en-sentence {
            font-weight: 500;
            color: #1e293b;
            margin-bottom: 6px;
            display: block;
        }

        .cn-sentence {
            color: #64748b;
            font-size: 0.95rem;
        }

        .pagination-container {
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .pagination .page-link {
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 5px;
            color: #64748b;
            border: none;
        }

        .pagination .page-item.active .page-link {
            background-color: var(--primary-color);
            color: white;
        }

        .pagination .page-link:hover {
            background-color: #e2e8f0;
            color: #334155;
        }

        .pagination .page-item.active .page-link:hover {
            background-color: var(--primary-color);
            color: white;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
        <div class="container">
            <a class="navbar-brand navbar-brand-custom" href="#">
                <i class="bi bi-mortarboard-fill me-2"></i>单词大师
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse ms-lg-4" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link nav-link-custom" href="/" onclick="setActive(this)">首页</a>
                    </li>
                    <li class="nav-item"><a class="nav-link nav-link-custom" href="/frequency"
                            onclick="setActive(this)">高频单词</a>
                    </li>
                    <li class="nav-item"><a class="nav-link nav-link-custom active" href="/dialogue"
                            onclick="setActive(this)">电影例句</a>
                    </li>
                </ul>
            </div>
            <div class="d-none d-lg-block">
                <button class="btn btn-outline-light rounded-pill px-4 btn-sm">登录</button>
            </div>
        </div>
    </nav>

    <div class="main-container">

        <form action="/dialogue" method="get" id="searchForm">
            <div class="search-container">
                <input type="text" class="search-input ps-3" name="keyword" id="searchInput" th:value="${keyword}"
                    placeholder="输入多个或一个英文、中文查询">

                <button type="submit" class="btn-search-icon">
                    <i class="bi bi-search"></i>
                </button>
            </div>
        </form>

        <div class="card card-table">
            <div class="table-responsive">
                <table class="table table-hover mb-0" th:if="${page.total > 0}">
                    <thead>
                        <tr>
                            <th scope="col" class="bg-primary text-white" style="width: 15%;">剧集</th>
                            <th scope="col" class="bg-primary text-white" style="width: 42%;">英文</th>
                            <th scope="col" class="bg-primary text-white" style="width: 43%;">中文</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${page.records}">
                            <td class="fw-medium text-secondary" th:text="${item.series}"></td>
                            <td>
                                <div class="word-text fw-normal" th:utext="${item.sentence}"></div>
                            </td>
                            <td>
                                <span class="cn-sentence text-dark" th:utext="${item.chinese}"></span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div th:if="${page.total == 0}" class="text-center py-5 text-muted">
                <i class="bi bi-inbox fs-1 d-block mb-2 opacity-25"></i>
                未找到相关单词
            </div>

            <!-- Pagination -->
            <div class="pagination-container" th:if="${page.total > 0}">
                <nav aria-label="Page navigation">
                    <ul class="pagination">
                        <li class="page-item" th:classappend="${page.current == 1} ? 'disabled'">
                            <a class="page-link"
                                th:href="@{/dialogue(page=${page.current - 1}, size=${page.size}, keyword=${keyword})}"
                                aria-label="Previous">
                                <span aria-hidden="true">&laquo;</span>
                            </a>
                        </li>

                        <!-- Simple Pagination: Show current, prev, next if available. A full logic is complex, this is basic -->
                        <li class="page-item active"><a class="page-link" href="#" th:text="${page.current}">1</a></li>

                        <li class="page-item" th:classappend="${page.current == page.pages} ? 'disabled'">
                            <a class="page-link"
                                th:href="@{/dialogue(page=${page.current + 1}, size=${page.size}, keyword=${keyword})}"
                                aria-label="Next">
                                <span aria-hidden="true">&raquo;</span>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        function setSearchType(type) {
            document.getElementById('typeInput').value = type;

            // Update placeholder & Dropdown Label
            const input = document.getElementById('searchInput');
            const label = document.getElementById('currentSearchLabel');

            if (type === 'general' || !type) {
                input.placeholder = "Type to search...";
                label.textContent = "Smart";
            } else if (type === 'prefix') {
                input.placeholder = "Enter prefix (e.g., para)";
                label.textContent = "Prefix";
            } else if (type === 'suffix') {
                input.placeholder = "Enter suffix (e.g., tion)";
                label.textContent = "Suffix";
            } else if (type === 'similarity') {
                input.placeholder = "Enter word (e.g., apple)";
                label.textContent = "Similar";
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
